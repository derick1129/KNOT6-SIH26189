# KNOT6 (originally PRAHARI) - full local stack.
#
# Two ways to run this project:
#   1. `docker compose up`               -> everything, including real Neo4j
#      (graph-analytics plugin) and PostgreSQL (application/business
#      metadata) instances -- production-shaped backend.
#   2. `uvicorn app.main:app` directly    -> zero-infra demo mode. Graph
#      defaults to in-process NetworkX and the application database
#      defaults to a local SQLite file -- nothing in this file needs to be
#      running. See backend/README.md and docs/KNOT6_ARCHITECTURE.md.
#
# Compose defaults GRAPH_BACKEND to neo4j and DATABASE_URL to the postgres
# service below so `docker compose up` demonstrates the real target
# architecture end-to-end: PostgreSQL owns investigations/cases/evidence
# metadata/users/audit; Neo4j owns the knowledge graph. Neither store is a
# duplicate of the other -- see docs/KNOT6_ARCHITECTURE.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knot6
      POSTGRES_PASSWORD: knot6_dev_password
      POSTGRES_DB: knot6
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knot6"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/prahari_password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: prahari_password
      DATABASE_URL: postgresql+psycopg://knot6:knot6_dev_password@postgres:5432/knot6
      JWT_SECRET: change-me-in-production-please
      AUTO_SEED_DEMO: "true"
      # Case Intelligence / AI Copilot (optional) -- passed through from the
      # host shell/.env; unset by default. See .env.example.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Reviewable, versioned schema changes -- see backend/alembic/versions/
    # -- rather than the zero-infra path's implicit create-all. init_db()
    # in app.main is still a harmless no-op safety net if this is skipped.
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  neo4j_data:
  postgres_data:
