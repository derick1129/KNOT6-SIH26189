# PRAHARI - full local stack.
#
# Two ways to run this project:
#   1. `docker compose up`               -> everything, including a real Neo4j
#      instance with the graph-analytics plugin (production-shaped backend).
#   2. `uvicorn app.main:app` directly    -> zero-infra demo mode (in-process
#      NetworkX graph, no services below needed at all). See backend/README.md.
#
# Compose defaults GRAPH_BACKEND to neo4j so `docker compose up` demonstrates
# the real target architecture end-to-end.

services:
  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/prahari_password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: prahari_password
      JWT_SECRET: change-me-in-production-please
      AUTO_SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  neo4j_data:
